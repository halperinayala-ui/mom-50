<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Chocolate Wrapper - VIP 50</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#800000',
                        secondary: '#D4AF37',
                    },
                    fontFamily: {
                        sans: ['Heebo', 'sans-serif'],
                        heading: ['Heebo', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body {
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Heebo', sans-serif;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        /* A4 Page Container for Print Preview */
        .page {
            background: white;
            width: 21cm;
            height: 29.7cm;
            position: relative;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        /* The Wrapper Full Size: 19.5cm wide x 19cm high */
        .wrapper {
            width: 19.5cm;
            height: 19cm;
            position: absolute;
            top: 5cm;
            left: 0.75cm;
            border: 1px dashed #ccc; /* Cut line */
            display: flex;
        }

        .back-flap {
            width: 4.5cm;
            height: 19cm;
            background-color: #fcfaf5;
        }

        .fold {
            width: 1cm;
            height: 19cm;
            background-color: #800000;
            color: #D4AF37;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            letter-spacing: 5px;
            font-weight: bold;
            writing-mode: vertical-rl;
            text-orientation: mixed;
        }

        .front {
            width: 8.5cm;
            height: 19cm;
            background-color: #f0f0f0; /* Will be covered by the boarding pass */
            display: flex;
            align-items: stretch;
            position: relative;
        }

        /* Front Boarding Pass Design (Copied from React component) */
        .boarding-pass-card {
            width: 100%;
            height: 100%;
            background: white;
            display: flex;
            flex-direction: column;
            border-left: 1px solid rgba(212, 175, 55, 0.3);
            border-right: 1px solid rgba(212, 175, 55, 0.3);
        }

        /* SVG Plane Icon */
        .plane-icon {
            width: 2rem;
            height: 2rem;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
        }

        @media print {
            body { background: white; }
            .page { box-shadow: none; margin: 0; }
        }
    </style>
</head>
<body>

<div class="page">
    <div class="wrapper">
        <!-- Right Flap (Back) - since RTL, left flap is first in DOM if flex-row, but let's just use standard flow -->
        <div class="back-flap border-l border-gray-200"></div>
        
        <!-- Right Fold -->
        <div class="fold border-l border-[#600000]">HAPPY BIRTHDAY</div>

        <!-- Front Graphic (8.5cm x 19cm) -->
        <div class="front">
            <div class="boarding-pass-card shadow-sm">
                <!-- Top Section - Airline & Flight -->
                <div class="bg-[#800000] text-[#FDFBF7] p-4 relative overflow-hidden" style="height: 3cm;">
                    <div class="absolute top-0 right-0 w-32 h-32 bg-white/5 rounded-full blur-2xl -translate-y-1/2 translate-x-1/2"></div>
                    
                    <div class="flex justify-between items-center relative z-10 h-full">
                        <div>
                            <p class="text-[#D4AF37] text-[10px] font-bold tracking-widest uppercase mb-1">חברת תעופה</p>
                            <h2 class="text-lg font-heading font-bold">VIP 50 AIRLINES</h2>
                        </div>
                        <svg class="plane-icon text-[#D4AF37] opacity-80" viewBox="0 0 24 24">
                            <path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.2-1.1.5l-1.3 1.5c-.3.3-.3.8 0 1.1L7 13l-4 4-2.5-.5c-.4-.1-.7.2-.8.6L0 18l4 2 2 4l.9.3c.4-.1.7-.4.6-.8l-.5-2.5 4-4 3.8 4.5c.3.3.8.3 1.1 0l1.5-1.3c.3-.2.6-.6.5-1.1L19.2 17.8z"/>
                        </svg>
                    </div>
                </div>

                <!-- Middle Section - Route -->
                <div class="p-4 bg-white relative flex-1 flex flex-col justify-center">
                    
                    <!-- Perforated lines -->
                    <div class="absolute -left-3 top-1/2 -translate-y-1/2 w-6 h-6 bg-[#fcfaf5] rounded-full shadow-inner border-r border-[#D4AF37]/20 z-20"></div>
                    <div class="absolute -right-3 top-1/2 -translate-y-1/2 w-6 h-6 bg-[#fcfaf5] rounded-full shadow-inner border-l border-[#D4AF37]/20 z-20"></div>
                    
                    <div class="border-b-2 border-dashed border-gray-200 absolute top-1/2 left-2 right-2 -translate-y-1/2"></div>

                    <div class="flex justify-between items-center relative z-10 mb-6">
                        <div class="text-right">
                            <p class="text-gray-400 text-[10px] uppercase tracking-wider mb-1">From</p>
                            <h3 class="text-2xl font-black text-[#800000] font-heading">49</h3>
                            <p class="text-[11px] font-medium text-gray-600 mt-1">שנות עשייה</p>
                        </div>
                        
                        <div class="flex flex-col items-center px-2">
                            <svg class="plane-icon w-5 h-5 text-[#D4AF37] mb-2 transform rotate-90" viewBox="0 0 24 24">
                                <path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.2-1.1.5l-1.3 1.5c-.3.3-.3.8 0 1.1L7 13l-4 4-2.5-.5c-.4-.1-.7.2-.8.6L0 18l4 2 2 4l.9.3c.4-.1.7-.4.6-.8l-.5-2.5 4-4 3.8 4.5c.3.3.8.3 1.1 0l1.5-1.3c.3-.2.6-.6.5-1.1L19.2 17.8z"/>
                            </svg>
                            <div class="text-[8px] text-gray-400 uppercase tracking-widest font-bold">Direct</div>
                        </div>

                        <div class="text-left">
                            <p class="text-gray-400 text-[10px] uppercase tracking-wider mb-1">To</p>
                            <h3 class="text-2xl font-black text-[#800000] font-heading">50</h3>
                            <p class="text-[11px] font-medium text-gray-600 mt-1">שנת היובל</p>
                        </div>
                    </div>
                    
                    <!-- Details Grid -->
                    <div class="grid grid-cols-2 gap-y-4 gap-x-2 relative z-10 mt-4 pt-2">
                        <div>
                            <p id="passenger-title" class="text-gray-400 text-[9px] uppercase tracking-wider mb-0.5">נוסעת</p>
                            <p id="passenger-name" class="font-bold text-[#4a4843] text-sm">אמא</p>
                        </div>
                        <div>
                            <p class="text-gray-400 text-[9px] uppercase tracking-wider mb-0.5">מחלקה</p>
                            <p class="font-bold text-[#4a4843] text-sm">ראשונה (VIP)</p>
                        </div>
                        <div>
                            <p class="text-gray-400 text-[9px] uppercase tracking-wider mb-0.5">יעד</p>
                            <p class="font-bold text-[#4a4843] text-sm">כה יתן וכה יוסיף</p>
                        </div>
                        <div>
                            <p class="text-gray-400 text-[9px] uppercase tracking-wider mb-0.5">טיסה</p>
                            <p class="font-bold text-[#4a4843] text-sm">MAZAL-TOV</p>
                        </div>
                    </div>
                </div>

                <!-- Bottom Section - QR Code instead of Barcode -->
                <div class="bg-[#fcfaf5] p-4 text-center border-t border-gray-100 flex flex-col items-center justify-center" style="height: 5cm;">
                    <p class="text-[10px] text-[#D4AF37] font-bold tracking-widest uppercase mb-1">Happy Birthday</p>
                    <p class="text-xs font-bold text-[#800000] mb-3">סרקו ליומן המסע</p>
                    <div id="qrcode" class="bg-white p-1 rounded border border-gray-200"></div>
                </div>
            </div>
        </div>

        <!-- Left Fold -->
        <div class="fold border-r border-[#600000]">VIP FLIGHT</div>

        <!-- Left Flap (Back) -->
        <div class="back-flap border-r border-gray-200"></div>
    </div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const userParam = urlParams.get('user');
    
    let qrUrl = "https://mom-50.vercel.app/";
    
    const passengerTitle = document.getElementById('passenger-title');
    const passengerName = document.getElementById('passenger-name');

    if (userParam === 'mom') {
        qrUrl += "?login=mom";
        passengerTitle.innerText = "נוסעת";
        passengerName.innerText = "אמא";
    } else if (userParam === 'dad') {
        qrUrl += "?login=dad";
        passengerTitle.innerText = "נוסע";
        passengerName.innerText = "אבא";
    } else {
        passengerTitle.innerText = "נוסעים";
        passengerName.innerText = "אמא ואבא";
    }

    new QRCode(document.getElementById("qrcode"), {
        text: qrUrl,
        width: 100,
        height: 100,
        colorDark : "#800000",
        colorLight : "#ffffff",
        correctLevel : QRCode.CorrectLevel.H
    });
</script>

</body>
</html>
